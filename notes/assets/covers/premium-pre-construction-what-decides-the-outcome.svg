    <polygon fill="#EDE8DC" opacity="0.55" points="104.57 274.73 148.74 274.73 148.74 318.89 115.81 318.89 115.81 328.45 158.29 328.45 158.29 265.17 95.01 265.17 95.01 350.14 104.57 340.58 104.57 274.73" transform="translate(-73, -243)"/>
