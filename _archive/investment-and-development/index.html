<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Legacy URL redirect stub.

    /investment-and-development/ was the previous slug for Practice
    Lane 01 (Land & Development Projects). The lane was repositioned
    on 2026-06-28 to buyer representation for off-market acquisitions
    (power of sale, private sales, assignment purchases, estate
    dispositions, portfolio additions). New canonical URL is
    /off-market-acquisitions/.

    Three redirect layers so any inbound link (bookmark, SERP hit,
    social share, notes-page cross-link) lands on the new URL:
      1. <link rel="canonical"> tells search engines the new URL is
         the canonical one for the content.
      2. <meta http-equiv="refresh"> fires on every browser as a
         zero-delay client-side redirect.
      3. window.location.replace runs first when JS is available
         (faster than meta refresh, and replace() means the old URL
         does not pollute the browser history stack).

    Brokerage attribution preserved on the fallback visible content
    per RECO Bulletin 5.1 in case a crawler renders the stub.
  -->
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="This page has moved to /off-market-acquisitions/. Buyer representation for investors and cash-ready buyers on off-market Ontario real estate acquisitions." />
  <title>Redirecting to Off-Market Acquisitions &middot; Primegate</title>
  <link rel="canonical" href="https://prime-gate.ca/off-market-acquisitions/" />
  <meta http-equiv="refresh" content="0; url=/off-market-acquisitions/" />
  <script>
    window.location.replace('/off-market-acquisitions/');
  </script>

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink-surface: #10141D;
      --bone: #EDE8DC;
      --bone-soft: rgba(237, 232, 220, 0.65);
      --gold: #C9A961;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ink-surface);
      color: var(--bone);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 28px 40px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
    }
    .wordmark {
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 24px;
      color: var(--bone);
      letter-spacing: -0.005em;
      line-height: 1;
    }
    .heading {
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(28px, 4.5vw, 40px);
      color: var(--bone);
      line-height: 1.15;
      letter-spacing: -0.015em;
    }
    .body {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: var(--bone-soft);
      line-height: 1.65;
    }
    .body a {
      color: var(--gold);
      border-bottom: 1px solid rgba(201, 169, 97, 0.40);
      padding-bottom: 1px;
      text-decoration: none;
    }
    .body a:hover { color: var(--bone); border-color: var(--bone); }
    .brokerage {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--bone-soft);
      letter-spacing: 0.04em;
      line-height: 1.5;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(237, 232, 220, 0.10);
    }
    .brokerage strong {
      display: block;
      font-weight: 500;
      color: var(--bone);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="wordmark">Primegate</p>
    <h1 class="heading">This page has moved.</h1>
    <p class="body">
      Practice Lane 01 has been repositioned. If you are not redirected
      automatically, <a href="/off-market-acquisitions/">continue to
      Off-Market Acquisitions</a>.
    </p>
    <p class="brokerage">
      <strong>HomeLife G1 Realty Inc., Brokerage</strong>
      Independently Owned &amp; Operated<br />
      Taran Aujla, Salesperson &middot; Ontario
    </p>
  </main>
</body>
</html>
