<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Primegate. A personal practice of Taran Aujla.">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0D14"/>

  <!-- Ambient gold glow, top-right -->
  <defs>
    <radialGradient id="glow" cx="85%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Editorial margin rule -->
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#EDE8DC" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Corner signature marks -->
  <g stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="square">
    <path d="M 84 84 L 84 108 M 84 84 L 108 84"/>
    <path d="M 1116 84 L 1116 108 M 1116 84 L 1092 84"/>
    <path d="M 84 546 L 84 522 M 84 546 L 108 546"/>
    <path d="M 1116 546 L 1116 522 M 1116 546 L 1092 546"/>
  </g>

  <!-- Primegate mark (top-left) -->
  <g transform="translate(110, 110) scale(0.6)">
    <polygon fill="#EDE8DC" points="73.33 243.48 73.33 350.14 82.88 350.14 82.88 253.04 170.42 253.04 170.42 340.58 104.57 340.58 95.01 350.14 179.98 350.14 179.98 243.48 73.33 243.48" transform="translate(-73, -243)"/>
    <polygon fill="#EDE8DC" opacity="0.5" points="104.57 274.73 148.74 274.73 148.74 318.89 115.81 318.89 115.81 328.45 158.29 328.45 158.29 265.17 95.01 265.17 95.01 350.14 104.57 340.58 104.57 274.73" transform="translate(-73, -243)"/>
  </g>

  <!-- Tiny eyebrow -->
  <text x="110" y="280" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#C9A961" letter-spacing="4" style="text-transform: uppercase;">ONTARIO REAL ESTATE &#183; BY REFERRAL OR APPLICATION</text>

  <!-- Wordmark. Primegate in serif. -->
  <text x="110" y="370" font-family="'Fraunces', 'Cormorant Garamond', Georgia, serif" font-size="96" font-weight="400" fill="#EDE8DC" letter-spacing="-1">Primegate</text>

  <!-- Italic tagline -->
  <text x="110" y="440" font-family="'Fraunces', 'Cormorant Garamond', Georgia, serif" font-size="38" font-style="italic" font-weight="300" fill="#C9A961" letter-spacing="-0.5">Real estate for serious files. Reviewed carefully.</text>

  <!-- Hairline separator -->
  <line x1="110" y1="480" x2="260" y2="480" stroke="#C9A961" stroke-width="1"/>

  <!-- Attribution line -->
  <text x="110" y="525" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#EDE8DC" fill-opacity="0.75">A personal practice of Taran Aujla, Salesperson</text>
  <text x="110" y="548" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#EDE8DC" fill-opacity="0.55">HomeLife G1 Realty Inc., Brokerage &#183; Independently Owned and Operated</text>
</svg>
